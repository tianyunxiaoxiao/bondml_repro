[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bondml-repro"
version = "0.1.0"
description = "Synthetic reproduction workflow for EEM-based index option return forecasting."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.scripts]
bondml-run = "bondml.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

